name: Deploy kit

# The production kit in deploy/ is only worth having if it still boots. This builds the three
# images (with a layer cache, linux/amd64 only), brings the stack up behind Caddy, and runs the
# backup/restore test against it. ci.yml already builds, lints and tests the application itself
# on every pull request; this adds what it does not cover: the prod compose, the backup scripts,
# and the images as the prod compose consumes them.

on:
  push:
    branches:
      - main
    paths:
      - "deploy/**"
      - "OpenRestoApi/Dockerfile"
      - "openresto-frontend/Dockerfile"
      - "nginx/**"
      - ".github/workflows/deploy-kit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "deploy/**"
      - "OpenRestoApi/Dockerfile"
      - "openresto-frontend/Dockerfile"
      - "nginx/**"
      - ".github/workflows/deploy-kit.yml"

permissions:
  contents: read

concurrency:
  group: deploy-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR deploy/backup/*.sh deploy/update.sh deploy/smoke.sh deploy/install.sh deploy/health.sh deploy/tests/*.sh

      # These run against stand-ins for the machine (no Docker daemon, no root, no network), so
      # they cost seconds, not the stack job's build.
      - name: Installer behaves (stand-ins for the machine)
        run: deploy/tests/install.test.sh

      - name: Update picks pull or rebuild
        run: deploy/tests/update.test.sh

      - name: Health check thresholds (real local TLS server)
        run: deploy/tests/health.test.sh

      - name: Compose files resolve
        env:
          DOMAIN: reservations.example.be
          ACME_EMAIL: ops@example.be
          OPENRESTO_VERSION: 2.4.1
          JWT_KEY: not-a-real-key
          ADMIN_EMAIL: owner@example.be
          ADMIN_PASSWORD: not-a-real-password
        run: |
          docker compose -f deploy/docker-compose.prod.yml config -q
          docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.build.yml config -q

      - name: Compose refuses to start without its required settings
        run: |
          if docker compose -f deploy/docker-compose.prod.yml config -q 2>/dev/null; then
            echo "::error::docker-compose.prod.yml resolved with no .env; a required variable lost its :? guard"
            exit 1
          fi

      - name: Caddyfile is valid
        run: |
          docker run --rm \
            -e DOMAIN=reservations.example.be -e ACME_EMAIL=ops@example.be \
            -e ACME_CA=https://acme-v02.api.letsencrypt.org/directory \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  stack:
    name: Stack boots, backup restores
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./OpenRestoApi/Dockerfile
          load: true
          tags: local/openresto-backend:ci
          cache-from: type=gha,scope=kit-backend
          cache-to: type=gha,mode=max,scope=kit-backend

      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: ./openresto-frontend
          file: ./openresto-frontend/Dockerfile
          build-args: EXPO_PUBLIC_API_URL=/api
          load: true
          tags: local/openresto-frontend:ci
          cache-from: type=gha,scope=kit-frontend
          cache-to: type=gha,mode=max,scope=kit-frontend

      - name: Build nginx
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          load: true
          tags: local/openresto-nginx:ci
          cache-from: type=gha,scope=kit-nginx
          cache-to: type=gha,mode=max,scope=kit-nginx

      # The test exercises a real off-site copy through a local-path remote.
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Boot the stack, back up, restore
        env:
          OPENRESTO_REGISTRY: local
          OPENRESTO_VERSION: ci
        run: deploy/tests/stack.test.sh

      - name: Container logs on failure
        if: failure()
        run: docker ps -a && for c in $(docker ps -aq); do echo "=== $c"; docker logs --tail=60 "$c"; done
