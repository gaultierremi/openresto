# Mounted into the nginx container as /etc/nginx/conf.d/00-realip.conf.
#
# Caddy sits in front of nginx and writes the visitor's address into X-Forwarded-For. nginx
# then appends the address it saw (Caddy's) before passing the request to the backend, and the
# backend, which reads one hop, would take Caddy's address for the visitor's: every guest would
# share one rate-limit bucket, one table-hold quota and one IP in the audit trail.
#
# Trusting X-Forwarded-For from the private ranges fixes that. It is safe because this nginx
# publishes no port: only containers on the compose networks can reach it, and the only one on
# the edge network is Caddy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
