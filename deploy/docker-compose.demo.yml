name: openresto-demo

x-journaux: &journaux
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  acces:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?Lancez ./deploy/demo.sh preparer}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - ./demo/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      relais:
        aliases: [openresto-demo-acces]
      facade:
    depends_on:
      reverse-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-Y",
          "off",
          "-q",
          "--spider",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    logging: *journaux

  reverse-proxy:
    image: localhost/openresto-demo-nginx:local
    build:
      context: ../nginx
    restart: unless-stopped
    environment:
      PORT: "80"
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      FRONTEND_HOST: frontend
      FRONTEND_PORT: "8081"
    volumes:
      - medias:/usr/share/nginx/html/media:ro
      - ./serveur-partage/nginx-realip.conf:/etc/nginx/conf.d/00-realip.conf:ro
    networks: [facade, interne]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: *journaux

  backend:
    image: localhost/openresto-demo-backend:local
    build:
      context: ..
      dockerfile: OpenRestoApi/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "8080"
      Jwt__Key: ${DEMO_JWT_KEY:?Lancez ./deploy/demo.sh preparer}
      Admin__Email: admin@openresto-demo.example
      Admin__Password: ${DEMO_ADMIN_PASSWORD:?Lancez ./deploy/demo.sh preparer}
      Cors__Origins: https://openresto.134-209-92-233.sslip.io
      WEBSITE_URL: https://openresto.134-209-92-233.sslip.io
      CONNECTION_STRING: Data Source=/data/openresto.db
      DATA_PROTECTION_KEYS_PATH: /data/dp-keys
      OPENRESTO_DEFAULT_LOCALE: fr
      PublicLaunch__Enabled: "false"
      EmailSettings__Host: ""
      EmailSettings__SendBookingConfirmations: "false"
      Logging__LogLevel__Microsoft: Warning
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - donnees:/data
      - medias:/app/wwwroot/media
    networks: [interne]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging: *journaux

  frontend:
    image: localhost/openresto-demo-frontend:local
    build:
      context: ../openresto-frontend
      args:
        EXPO_PUBLIC_API_URL: /api
    restart: unless-stopped
    networks: [interne]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *journaux

networks:
  relais:
    external: true
    name: openresto-demo-caddy
  facade:
    internal: true
  interne:
    internal: true

volumes:
  donnees:
  medias:
