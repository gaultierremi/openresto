# Monté dans le conteneur nginx comme /etc/nginx/conf.d/00-realip.conf.
#
# L'adresse du visiteur arrive dans X-Forwarded-For. Avec un nom de domaine, deux relais se
# suivent : le Caddy du serveur, puis le Caddy d'entrée d'OpenResto, et le deuxième AJOUTE l'adresse
# du premier à la fin. Le visiteur n'est donc plus le dernier de la liste mais le premier qui ne
# soit pas une adresse privée : c'est ce que fait « real_ip_recursive on ». Sans lui, tous les
# visiteurs partageraient la même adresse (celle du relais), donc le même quota de requêtes, la
# même limite de tables retenues et la même adresse dans le journal d'audit.
#
# Sûr parce que nginx ne publie aucun port : seul le Caddy d'entrée peut lui parler, et celui-ci
# ne croit un X-Forwarded-For que venant d'une adresse privée (voir Caddyfile).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
